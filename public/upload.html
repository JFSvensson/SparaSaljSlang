<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparaSäljSläng</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-brand">
      <h1>🗃️ Spara, sälj eller släng?</h1>
      <span class="header-pill">Ladda upp</span>
    </div>
    <nav>
      <a href="index.html">Bedöm föremål</a>
      <a href="list.html">Alla föremål</a>
      <a href="upload.html" class="active">Ladda upp föremål</a>
      <button id="logout-btn" class="nav-btn">Logga ut</button>
    </nav>
  </header>

  <main>
    <!-- Upload section -->
    <section id="upload-section" class="card">
      <h2>Ladda upp ett föremål</h2>
      <form id="upload-form" enctype="multipart/form-data">
        <label for="image-input" id="upload-dropzone" class="file-label">
          <span id="file-label-text">Välj en bild…</span>
          <span class="file-label-hint">PNG, JPEG, GIF eller WebP. Max 10 MB.</span>
          <input type="file" id="image-input" name="image" accept="image/*" required />
        </label>
        <div id="image-preview" class="image-preview hidden">
          <img id="image-preview-image" alt="Förhandsvisning av vald bild" />
        </div>
        <button type="submit" class="btn btn-upload">Ladda upp</button>
      </form>
      <p id="upload-status" class="status-msg"></p>
    </section>

    <section id="empty-section" class="card hidden">
      <p>Inga föremål finns ännu. Ladda upp det första!</p>
    </section>
  </main>

  <script src="client.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
