<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparaSäljSläng</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-brand">
      <h1>🗃️ Spara, sälj eller släng?</h1>
      <span class="header-pill">Bedöm och organisera</span>
    </div>
    <nav>
      <a href="index.html" class="active">Bedöm föremål</a>
      <a href="list.html">Alla föremål</a>
      <a href="upload.html">Ladda upp föremål</a>
      <button id="logout-btn" class="nav-btn">Logga ut</button>
    </nav>
  </header>

  <main>
    <section id="summary-section" class="summary-panel" aria-labelledby="summary-title">
      <h2 id="summary-title">Översikt</h2>
      <div class="summary-grid">
        <div class="summary-stat"><span id="summary-items" class="summary-value">0</span><span>Föremål</span></div>
        <div class="summary-stat"><span id="summary-votes" class="summary-value">0</span><span>Röster</span></div>
        <div class="summary-stat summary-save"><span id="summary-save" class="summary-value">0</span><span>Spara</span></div>
        <div class="summary-stat summary-sell"><span id="summary-sell" class="summary-value">0</span><span>Sälj</span></div>
        <div class="summary-stat summary-throw"><span id="summary-throw" class="summary-value">0</span><span>Släng</span></div>
      </div>
      <p id="summary-detail" class="summary-detail"></p>
    </section>

    <!-- Item viewer -->
    <section id="viewer-section" class="card hidden">
      <h2 id="viewer-title">Vad ska hända med detta?</h2>
      <div id="image-wrapper">
        <img id="item-image" src="" alt="Föremål" />
        <p id="item-name" class="item-name"></p>
      </div>

      <div class="choice-buttons">
        <button class="btn btn-save" data-choice="save">💚 Spara</button>
        <button class="btn btn-sell" data-choice="sell">💰 Sälj</button>
        <button class="btn btn-throw" data-choice="throw">🗑️ Släng</button>
      </div>

      <div class="choice-buttons">
        <button id="delete-current-btn" class="btn btn-throw">🗑️ Ta bort detta föremål</button>
      </div>

      <div id="vote-result" class="vote-result hidden">
        <h3>Röster hittills</h3>
        <div class="vote-bars">
          <div class="vote-row">
            <span class="vote-label">💚 Spara</span>
            <div class="bar-bg"><div id="bar-save" class="bar bar-save"></div></div>
            <span id="count-save" class="vote-count">0</span>
          </div>
          <div class="vote-row">
            <span class="vote-label">💰 Sälj</span>
            <div class="bar-bg"><div id="bar-sell" class="bar bar-sell"></div></div>
            <span id="count-sell" class="vote-count">0</span>
          </div>
          <div class="vote-row">
            <span class="vote-label">🗑️ Släng</span>
            <div class="bar-bg"><div id="bar-throw" class="bar bar-throw"></div></div>
            <span id="count-throw" class="vote-count">0</span>
          </div>
        </div>
        <button id="next-btn" class="btn btn-next">Nästa föremål →</button>
      </div>
    </section>

    <section id="empty-section" class="card hidden">
      <p>Inga föremål finns ännu. Ladda upp det första!</p>
    </section>
  </main>

  <script src="client.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
