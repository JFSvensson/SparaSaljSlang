<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparaSäljSläng &mdash; Alla föremål</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-brand">
      <h1>🗃️ Spara, sälj eller släng?</h1>
      <span class="header-pill">Alla föremål</span>
    </div>
    <nav>
      <a href="index.html">Bedöm föremål</a>
      <a href="list.html" class="active">Alla föremål</a>
      <a href="upload.html">Ladda upp föremål</a>
      <button id="logout-btn" class="nav-btn">Logga ut</button>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Alla uppladdade föremål</h2>
      <div class="list-toolbar">
        <label class="visually-hidden" for="filter-name">Sök föremål</label>
        <input id="filter-name" type="search" placeholder="Sök föremål" autocomplete="off" />
        <label for="filter-date">Uppladdat</label>
        <select id="filter-date">
          <option value="all">Alla datum</option>
          <option value="7">Senaste 7 dagarna</option>
          <option value="30">Senaste 30 dagarna</option>
        </select>
        <label for="sort-select">Sortera efter</label>
        <select id="sort-select">
          <option value="save_count">Spara</option>
          <option value="sell_count">Sälj</option>
          <option value="throw_count">Släng</option>
        </select>
        <button
          id="sort-direction"
          class="icon-button"
          type="button"
          aria-label="Sortera fallande"
          title="Sortera fallande"
        >↓</button>
        <button id="bulk-delete-open" class="btn btn-throw" type="button" disabled>
          Ta bort valda (0)
        </button>
      </div>
      <p id="list-status" class="status-msg"></p>
      <div id="items-grid" class="items-grid"></div>
    </section>
  </main>

  <!-- Item detail modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content card">
      <button id="modal-close" class="modal-close" aria-label="Stäng">✕</button>
      <img id="modal-image" src="" alt="Föremål" />
      <h3 id="modal-name"></h3>
      <div class="vote-bars">
        <div class="vote-row">
          <span class="vote-label">💚 Spara</span>
          <div class="bar-bg"><div id="modal-bar-save" class="bar bar-save"></div></div>
          <span id="modal-count-save" class="vote-count">0</span>
        </div>
        <div class="vote-row">
          <span class="vote-label">💰 Sälj</span>
          <div class="bar-bg"><div id="modal-bar-sell" class="bar bar-sell"></div></div>
          <span id="modal-count-sell" class="vote-count">0</span>
        </div>
        <div class="vote-row">
          <span class="vote-label">🗑️ Släng</span>
          <div class="bar-bg"><div id="modal-bar-throw" class="bar bar-throw"></div></div>
          <span id="modal-count-throw" class="vote-count">0</span>
        </div>
      </div>
      <p class="modal-verdict" id="modal-verdict"></p>
      <div class="modal-actions">
        <button id="modal-delete" class="btn btn-throw">🗑️ Ta bort föremål</button>
      </div>
    </div>
  </div>

  <div id="bulk-delete-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content card">
      <button id="bulk-delete-close" class="modal-close" aria-label="Stäng">✕</button>
      <h3>Ta bort valda föremål</h3>
      <p id="bulk-delete-message" class="login-help"></p>
      <p id="bulk-delete-status" class="status-msg"></p>
      <div class="modal-actions">
        <button id="bulk-delete-cancel" class="btn" type="button">Avbryt</button>
        <button id="bulk-delete-confirm" class="btn btn-throw" type="button">Ta bort</button>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
  <script src="ui.js"></script>
  <script src="components.js"></script>
  <script src="list.js"></script>
</body>
</html>
