<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logga in – SparaSäljSläng</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🗃️ Spara, sälj eller släng?</h1>
  </header>

  <main>
    <section class="card">
      <h2>Logga in</h2>
      <p class="login-help">Ange användarnamn och lösenord som satts av utvecklaren vid deployment.</p>
      <form id="login-form" class="login-form">
        <label>
          Användarnamn
          <input type="text" id="username" name="username" autocomplete="username" required />
        </label>
        <label>
          Lösenord
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-upload">Logga in</button>
      </form>
      <p id="login-status" class="status-msg"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('login-status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      status.textContent = 'Loggar in…';
      status.className = 'status-msg';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const body = await response.json();
        if (!response.ok) throw new Error(body.error || 'Inloggning misslyckades');

        window.location.href = '/index.html';
      } catch (error) {
        status.textContent = error.message;
        status.className = 'status-msg error';
      }
    });
  </script>
</body>
</html>
