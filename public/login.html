<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logga in – SparaSäljSläng</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🗃️ Spara, sälj eller släng?</h1>
  </header>

  <main>
    <section class="card">
      <h2>Logga in</h2>
      <p class="login-help">Ange användarnamn och lösenord som satts av utvecklaren vid deployment.</p>
      <form id="login-form" class="login-form">
        <label>
          Användarnamn
          <input type="text" id="username" name="username" autocomplete="username" required />
        </label>
        <label>
          Lösenord
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-upload">Logga in</button>
      </form>
      <p id="login-status" class="status-msg"></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
